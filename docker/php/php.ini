; Application-wide PHP settings (dev + prod)
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 64M
post_max_size = 64M

date.timezone = UTC
expose_php = Off

error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
