name: wtg

# Only the service hostnames are injected. Everything else (driver choice, credentials)
# stays in .env, so phpunit.xml can still override the drivers for the test suite --
# PHPUnit does not overwrite variables that already exist in the real environment.
x-app-env: &app-env
  DB_HOST: mysql
  REDIS_HOST: redis

x-app: &app
  build:
    context: ..
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: wtg-app:dev
  volumes:
    - ..:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  queue:
    <<: *app
    # Unprivileged so job logs stay owned by the host user in the bind mount.
    user: www-data
    command: php artisan queue:work --tries=3 --timeout=60 --sleep=1 --max-time=3600
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wtg}
      MYSQL_USER: ${DB_USERNAME:-wtg}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the wtg_test database the test suite runs against (first boot only).
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
